<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Project – Esteban Caicedo</title>
  <link rel="stylesheet" href="style.css" />
  <!-- model-viewer (para los .glb de "model") -->
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>
</head>
<body>
  <div class="container">
    <!-- NAV SUPERIOR -->
   <header class="nav">
  <div class="nav-left">
    <h1 id="project-title" class="site-title site-title--small">
      Project title
    </h1>

    <p id="project-tagline" class="detail-summary">
      Project short description.
    </p>
  </div>

  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="projects.html">Projects</a>
    <a href="about.html">About me</a>
    <a href="https://www.linkedin.com/in/esteban-caicedo-945bb1300/"
       target="_blank"
       rel="noreferrer">
      LinkedIn
    </a>
  </nav>
</header>


    <!-- CUERPO DEL PROYECTO -->
    <main class="detail">
      <!-- Columna izquierda: viewer 3D / media principal -->
      <section class="detail-media">
        <div id="viewer" class="viewer">
          <p class="viewer-empty">Loading 3D model…</p>
        </div>
      </section>

      <!-- Columna derecha: galería de imágenes / videos -->
      <section>
        <div id="detail-gallery" class="detail-gallery slider">
          <div class="slider-empty-msg">Loading gallery…</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    // ========= UTILIDADES =========
    const isVideo = (src) => /\.(mp4|webm|ogg)$/i.test(src || "");

    function makeMediaEl(src) {
      if (!src) {
        const ph = document.createElement("div");
        ph.className = "slider-empty-msg";
        ph.textContent = "No media";
        return ph;
      }

      if (isVideo(src)) {
        const v = document.createElement("video");
        v.src = src;
        v.muted = true;
        v.loop = true;
        v.autoplay = true;
        v.playsInline = true;
        v.preload = "metadata";
        v.setAttribute("disablepictureinpicture", "");
        return v;
      } else {
        const img = new Image();
        img.src = src;
        img.alt = "";
        img.loading = "lazy";
        return img;
      }
    }

    function mountMediaSlider(container, mediaPaths, opts) {
      opts = opts || {};
      const autoplay = opts.autoplay !== false;
      const interval = opts.interval || 3000;

      container.innerHTML = "";
      container.classList.add("slider");

      if (!mediaPaths || !mediaPaths.length) {
        container.classList.add("slider--empty");
        container.innerHTML =
          '<div class="slider-empty-msg">No media available</div>';
        return;
      }

      const a = document.createElement("div");
      const b = document.createElement("div");
      a.className = "slide-layer active";
      b.className = "slide-layer";

      let useA = true;
      let idx = 0;
      let timer = null;

      a.appendChild(makeMediaEl(mediaPaths[0]));
      b.appendChild(makeMediaEl(mediaPaths[1] || mediaPaths[0]));
      container.append(a, b);

      // Controles
      const left = document.createElement("div");
      const right = document.createElement("div");
      left.className = "ctrl left";
      right.className = "ctrl right";
      left.textContent = "‹";
      right.textContent = "›";
      container.append(left, right);

      // Dots
      let dots = null;
      if (mediaPaths.length > 1) {
        dots = document.createElement("div");
        dots.className = "dots";
        mediaPaths.forEach((_, i) => {
          const d = document.createElement("span");
          d.className = "dot" + (i === 0 ? " active" : "");
          d.onclick = () => show(i);
          dots.appendChild(d);
        });
        container.appendChild(dots);
      }

      function show(nextIndex) {
        idx = (nextIndex + mediaPaths.length) % mediaPaths.length;
        const target = useA ? b : a;
        target.innerHTML = "";
        target.appendChild(makeMediaEl(mediaPaths[idx]));
        (useA ? a : b).classList.remove("active");
        (useA ? b : a).classList.add("active");
        useA = !useA;

        if (dots) {
          Array.from(dots.children).forEach((d, i) => {
            d.className = "dot" + (i === idx ? " active" : "");
          });
        }
      }

      left.onclick = () => show(idx - 1);
      right.onclick = () => show(idx + 1);

      function start() {
        if (autoplay && mediaPaths.length > 1) {
          timer = setInterval(() => show(idx + 1), interval);
        }
      }

      function stop() {
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
      }

      container.addEventListener("mouseenter", stop);
      container.addEventListener("mouseleave", start);
      start();
    }

    // ========= CARGA DEL PROYECTO (ADAPTADO A TU JSON) =========
    async function loadProjectDetail() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");

      if (!slug) {
        console.error("No slug in URL");
        return;
      }

      try {
        const res = await fetch("projects.json", { cache: "no-store" });
        const projects = await res.json();
        const project = projects.find((p) => p.slug === slug);

        if (!project) {
          console.error("Project not found for slug:", slug);
          return;
        }

        // Título y descripción
        document.getElementById("project-title").textContent = project.title;
        document.getElementById("project-tagline").textContent =
          project.description || "";

        // Viewer 3D / media principal
        const viewer = document.getElementById("viewer");
        viewer.innerHTML = "";

        // Aquí usamos "model" (como en tu JSON)
        if (project.model) {
          const mv = document.createElement("model-viewer");
          mv.src = project.model;
          mv.setAttribute("camera-controls", "");
          mv.setAttribute("touch-action", "pan-y");
          mv.setAttribute("shadow-intensity", "0.6");
          mv.setAttribute("exposure", "0.9");
          mv.setAttribute("auto-rotate", "");
          viewer.appendChild(mv);
        } else if (project.images && project.images.length) {
          viewer.appendChild(makeMediaEl(project.images[0]));
        } else if (project.videos && project.videos.length) {
          viewer.appendChild(makeMediaEl(project.videos[0]));
        } else {
          const p = document.createElement("p");
          p.className = "viewer-empty";
          p.textContent = "No 3D model or media available.";
          viewer.appendChild(p);
        }

        // Galería derecha: todas las imágenes + videos
        const galleryEl = document.getElementById("detail-gallery");
        const media = [
          ...(project.images || []),
          ...(project.videos || []),
        ];
        mountMediaSlider(galleryEl, media, { autoplay: true, interval: 3500 });
      } catch (err) {
        console.error("Error loading project detail:", err);
      }
    }

    document.addEventListener("DOMContentLoaded", loadProjectDetail);
  </script>
</body>
</html>
